<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b4c"><title>Masuk — BAGPSI REPORT</title>
<link rel="icon" href="./assets/PSI.png" type="image/png">
<link rel="stylesheet" href="./css/base.css"><link rel="stylesheet" href="./css/auth.css">
<script type="module" src="./js/pages/login.js"></script>
</head><body class="auth-page">
<main class="auth-wrap">
  <section class="auth-card">
    <img class="auth-logo" src="./assets/PSI.png" alt="Logo BAGPSI">
    <p class="eyebrow">RO SDM POLDA BANTEN</p>
    <h1>BAGPSI REPORT</h1>
    <p class="muted">Sistem pelaporan dan administrasi kegiatan BAGPSI.</p>
    <form id="login-form">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="nama@instansi.go.id">
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password">
      <button class="btn primary full" type="submit" id="login-submit">Masuk</button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </section>
  <footer>© BAGPSI RO SDM POLDA BANTEN</footer>
</main></body></html>
